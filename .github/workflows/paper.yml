name: paper-trade

# ARCHITECTURE NOTE
#
# The obvious design — a short job on a */15 cron — depends entirely on
# GitHub's scheduler, which is documented as best-effort and in practice runs
# 15-40 minutes late, skips slots under load, and took over an hour to fire
# at all on this repo when it was new. For 15m strategies that is the
# difference between trading a signal and missing it.
#
# So instead each job POLLS INTERNALLY every 60 seconds for ~5h50m (just under
# the 6h runner limit). Within a job the timing is exact and owes nothing to
# the scheduler. Cron only has to start a job roughly every 6 hours, and even
# a 30-minute delay there costs one gap instead of degrading every single bar.
#
# The bot replays any bars missed during a gap (see feed.closed_since), so a
# late start is caught up correctly rather than silently skipped.
#
# State is committed from inside the job whenever a trade closes and at least
# every 15 minutes, so a killed runner loses minutes, not hours.

on:
  schedule:
    - cron: "5 */6 * * *"     # 00:05, 06:05, 12:05, 18:05 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run should poll for (minutes)"
        required: false
        default: "350"

concurrency:
  group: paper-trade
  cancel-in-progress: false   # queue, never run two writers at once

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify engine still matches the backtest
        # If the live engine stops reproducing the validated backtest, the
        # paper results stop meaning anything. Fail rather than trade.
        run: python -m paper_live.verify_parity

      - name: Adverse-condition tests
        # The failure modes this deployment actually has: late batched bar
        # delivery, restart mid-position, duplicate cycles, cold start, long
        # outage, feed failure. The parity test replays a punctual contiguous
        # stream and cannot catch any of them.
        run: python -m paper_live.test_adverse

      - name: Trade
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_GIT_SYNC: "1"
        run: |
          python -m paper_live.run \
            --loop-minutes "${{ github.event.inputs.minutes || 350 }}"

      - name: Final state commit
        if: always()        # also run if the trade step was cancelled
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -f paper_live/paper.db paper_live/paper.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change to commit"
            exit 0
          fi
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC') (final)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push final state" >&2
          exit 1
